services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: svara
      POSTGRES_USER: svara
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svara -d svara"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - svara-postgres:/var/lib/postgresql/data

volumes:
  svara-postgres:
