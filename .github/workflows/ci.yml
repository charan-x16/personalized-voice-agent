name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.17.0"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:web
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          version: "latest-known"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --directory apps/api --frozen --dev
      - run: uv run --directory apps/api ruff check src tests scripts
      - run: uv run --directory apps/api ruff format --check src tests scripts
      - run: uv run --directory apps/api pytest
      - run: uv run --directory apps/api alembic heads
      - run: uv run --directory apps/api python scripts/export_openapi.py --check
